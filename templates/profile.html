{% extends "base.html" %}

{% block title %}Profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Welcome back, {{ session.user_name }}!</h1>
            <p class="auth-subtitle">Your Spendly profile</p>
        </div>

        <div class="auth-card">
            <div style="padding: 2rem; text-align: center;">
                <p style="color: var(--ink-soft); margin-bottom: 1rem;">
                    You are logged in as <strong>{{ session.user_email }}</strong>
                </p>
                <p style="color: var(--ink-muted); font-size: 0.9rem;">
                    Full profile features coming in Step 4
                </p>
            </div>
        </div>

    </div>
</section>

{% endblock %}
